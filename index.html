/* 카카오톡 전체 화면 */
.kakao-screen {
  background: #ffffff;
  color: #191919;
  min-height: 100%;
  font-family: -apple-system, sans-serif;
}

/* 상단 채팅 제목 */
.kakao-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px 18px;
}

.kakao-header h1 {
  font-size: 25px;
  font-weight: 750;
  margin: 0;
}

.kakao-actions {
  display: flex;
  gap: 20px;
  font-size: 23px;
  color: #222;
}

/* 채팅 목록 */
.kakao-chat {
  display: flex;
  align-items: center;
  padding: 11px 17px;
  gap: 12px;
  min-height: 75px;
}

/* 재관이 방만 클릭 가능 */
.kakao-chat:first-child {
  cursor: pointer;
}

/* 프로필 사진 */
.kakao-avatar {
  width: 54px;
  height: 54px;
  border-radius: 19px;
  background: #eeeeee;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  flex-shrink: 0;
}

/* 이름과 메시지 */
.kakao-info {
  flex: 1;
  min-width: 0;
}

.kakao-name {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 5px;
}

.kakao-pin {
  font-size: 12px;
  margin-left: 3px;
}

.kakao-message {
  font-size: 13px;
  color: #999999;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* 메시지 시간 */
.kakao-time {
  font-size: 11px;
  color: #aaaaaa;
  align-self: flex-start;
  padding-top: 8px;
}

/* 하단 메뉴 */
.kakao-bottom {
  position: absolute;
  bottom: 16px;
  left: 0;
  width: 100%;
  height: 65px;
  background: #fafafa;
  border-top: 1px solid #eeeeee;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 5;
}

.kakao-bottom div {
  text-align: center;
  font-size: 23px;
  color: #999999;
}

.kakao-bottom small {
  display: block;
  font-size: 10px;
  margin-top: 4px;
}

.kakao-bottom .selected {
  color: #191919;
}

/* 기존 필터와 목록 간격 */
.kakao-screen .kakao-filter {
  padding-bottom: 12px;
}

.kakao-screen .kakao-list {
  padding-bottom: 95px;
}

.kakao-profile-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 19px;
}

const screens=['lock','pass','home','appview'];function show(id){screens.forEach(s=>document.getElementById(s).classList.toggle('active',s===id))}let code='';function reset(){code='';document.getElementById('error').textContent='';drawDots()}function drawDots(){document.getElementById('dots').innerHTML=Array.from({length:4},(_,i)=>`<div class="dot ${i<code.length?'filled':''}"></div>`).join('')}function press(n){if(code.length>=4)return;code+=n;drawDots();if(code.length===4)setTimeout(()=>{if(code==='1209')show('home');else document.getElementById('error').textContent='암호가 올바르지 않습니다.';code='';drawDots()},180)}[1,2,3,4,5,6,7,8,9,'',0,'⌫'].forEach(n=>{const b=document.createElement('button');b.className='key'+(n===''?' empty':'');b.textContent=n;b.onclick=()=>n==='⌫'?(code=code.slice(0,-1),drawDots()):press(String(n));document.getElementById('pad').appendChild(b)});drawDots();

const recent=['포인세티아','프로포즈 반지 브랜드 추천','수선화 꽃말','동백꽃 꽃말','꽃집','12월 꽃 종류'];
