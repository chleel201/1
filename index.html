/* 카카오톡 전체 화면 */
.kakao-screen {
  background: #ffffff;
  color: #191919;
  min-height: 100%;
  font-family: -apple-system, sans-serif;
}

/* 상단 채팅 제목 */
.kakao-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px 18px;
}

.kakao-header h1 {
  font-size: 25px;
  font-weight: 750;
  margin: 0;
}

.kakao-actions {
  display: flex;
  gap: 20px;
  font-size: 23px;
  color: #222;
}

/* 채팅 목록 */
.kakao-chat {
  display: flex;
  align-items: center;
  padding: 11px 17px;
  gap: 12px;
  min-height: 75px;
}

/* 재관이 방만 클릭 가능 */
.kakao-chat:first-child {
  cursor: pointer;
}

/* 프로필 사진 */
.kakao-avatar {
  width: 54px;
  height: 54px;
  border-radius: 19px;
  background: #eeeeee;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  flex-shrink: 0;
}

/* 이름과 메시지 */
.kakao-info {
  flex: 1;
  min-width: 0;
}

.kakao-name {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 5px;
}

.kakao-pin {
  font-size: 12px;
  margin-left: 3px;
}

.kakao-message {
  font-size: 13px;
  color: #999999;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* 메시지 시간 */
.kakao-time {
  font-size: 11px;
  color: #aaaaaa;
  align-self: flex-start;
  padding-top: 8px;
}

/* 하단 메뉴 */
.kakao-bottom {
  position: absolute;
  bottom: 16px;
  left: 0;
  width: 100%;
  height: 65px;
  background: #fafafa;
  border-top: 1px solid #eeeeee;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 5;
}

.kakao-bottom div {
  text-align: center;
  font-size: 23px;
  color: #999999;
}

.kakao-bottom small {
  display: block;
  font-size: 10px;
  margin-top: 4px;
}

.kakao-bottom .selected {
  color: #191919;
}

/* 기존 필터와 목록 간격 */
.kakao-screen .kakao-filter {
  padding-bottom: 12px;
}

.kakao-screen .kakao-list {
  padding-bottom: 95px;
}

.kakao-profile-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 19px;
}
.default-profile {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  display: block;
}
/* 전화와 메시지 기본 프로필 이미지 */
.ios-avatar,
.avatar {
  background-image: url("icons/default-profile.png") !important;
  background-size: cover !important;
  background-position: center !important;
  background-repeat: no-repeat !important;
  border-radius: 50% !important;
  overflow: hidden;
}

/* 기존 기본 프로필 문자 숨기기 */
.ios-avatar {
  font-size: 0 !important;
}

/* 전화 및 메시지 프로필 */
.ios-row .avatar {
  width: 49px;
  height: 49px;
  flex-shrink: 0;
  border-radius: 50% !important;
  overflow: hidden;
  background: transparent !important;
  background-image: none !important;
}

.ios-row .default-profile {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  border-radius: 50%;
}

/* 메시지 목록 전용 기본 프로필: 외부 이미지 파일 없이 표시 */
.message-avatar {
  width: 49px;
  height: 49px;
  flex: 0 0 49px;
  border-radius: 50%;
  overflow: hidden;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #bad7ee, #818dc2);
}
.message-avatar svg { width: 100%; height: 100%; display: block; }

/* 재관이 카카오톡 대화방 */
.appview #appcontent:has(.chat-room){padding-top:0;padding-bottom:0;overflow:hidden}
.chat-room{height:100%;display:flex;flex-direction:column;background:#abc1d1;color:#222;position:relative}
.chat-top{flex:0 0 auto;padding:54px 12px 12px;display:flex;align-items:center;justify-content:space-between;gap:9px;background:#abc1d1;z-index:2}
.chat-top .chat-back,.chat-top .chat-actions{display:flex;align-items:center;gap:8px}
.chat-top button{border:0;background:transparent;color:#20292f;font-size:24px;padding:5px;cursor:pointer}
.chat-top .chat-title{font-size:18px;font-weight:700;text-align:center;flex:1}
.chat-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 12px 22px;scrollbar-width:thin}
.chat-date{text-align:center;margin:24px auto 18px;display:table;border-radius:18px;background:#899facaa;color:white;font-size:12px;padding:6px 14px}
.chat-line{display:flex;align-items:flex-end;gap:6px;margin:7px 0;max-width:100%}
.chat-line.outgoing{justify-content:flex-end}
.chat-line.incoming{justify-content:flex-start;align-items:flex-start}
.chat-profile{width:39px;height:39px;flex:0 0 39px;border-radius:15px;object-fit:cover;background:#eee}
.chat-sender{font-size:12px;margin:0 0 5px;color:#344653}
.chat-stack{display:flex;flex-direction:column;align-items:flex-start;min-width:0;max-width:calc(100% - 50px)}
.chat-bubble{display:inline-block;max-width:100%;padding:10px 12px;border-radius:13px;font-size:15px;line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere}
.incoming .chat-bubble{background:#fff;border-top-left-radius:3px}
.outgoing .chat-bubble{background:#fee500;border-top-right-radius:3px}
.chat-meta{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:10px;color:#526572;white-space:nowrap;align-self:flex-end;padding-bottom:2px}
.chat-unread{color:#f7db00;font-weight:800;font-size:12px}
.chat-inputbar{flex:0 0 auto;background:#f7f9fa;padding:9px 12px 24px;display:flex;align-items:center;gap:10px}
.chat-plus,.chat-tool{font-size:23px;color:#555;border:0;background:transparent;padding:3px}
.chat-input-shell{flex:1;border:1px solid #e2e6e8;background:white;border-radius:20px;min-height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#a4a8aa;font-size:14px}
.chat-input-shell span:last-child{font-size:20px;color:#60676c}

function kakaoPage() {
  return `
    <div class="kakao-screen">

      <div class="kakao-header">
        <h1>채팅</h1>
        <div class="kakao-actions">
          <span>⌕</span>
          <span>⊕</span>
          <span>⚙</span>
        </div>
      </div>

      <div class="kakao-filter">
        <span>전체</span>
        <span>안읽음</span>
        <span>ChatGPT</span>
        <span>통화</span>
      </div>

      <div class="kakao-list">
        ${kakao.map(([name, msg, time, emoji], i) => `
          <div class="kakao-chat"
            ${name === '재관이 🖤'
              ? `onclick="detail('재관이 🖤')"`
              : ''}>

            <div class="kakao-avatar">
             ${name === '재관이 🖤'
    ? '<img src="icons/jaegwan.jpeg" class="kakao-profile-img">'
    : name === '포도'
      ? '<img src="icons/jaegwan.jpeg" class="kakao-profile-img" alt="포도 프로필">'
      : kakaoProfileImages[name]
        ? `<img src="${kakaoProfileImages[name]}" class="kakao-profile-img" alt="${name} 프로필">`
        : emoji}
</div>
    

            <div class="kakao-info">
              <div class="kakao-name">
                ${name}
                ${name === '재관이 🖤'
                  ? '<span class="kakao-pin">📌</span>'
                  : ''}
              </div>

              <div class="kakao-message">
                ${msg}
              </div>
            </div>

            <div class="kakao-time">
              ${time}
            </div>

          </div>
        `).join('')}
      </div>

      <div class="kakao-bottom">
        <div>♙<small>친구</small></div>
        <div class="selected">●<small>채팅</small></div>
        <div>◎<small>오픈채팅</small></div>
        <div>•••<small>더보기</small></div>
      </div>

    </div>
  `;
}

function chatEscape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function detail(name){
  if(name!=='재관이 🖤')return;
  const content=document.getElementById('appcontent');
  content.innerHTML=`<div class="chat-room">
    <div class="chat-top">
      <div class="chat-back"><button aria-label="채팅 목록으로" onclick="openApp('카카오톡')">❮</button></div>
      <div class="chat-title">재관이 🖤</div>
      <div class="chat-actions"><button aria-label="검색">⌕</button><button aria-label="통화">♧</button><button aria-label="메뉴">☰</button></div>
    </div>
    <div class="chat-scroll" id="jaegwan-scroll">
      ${jaegwanChat.map(day=>`<div class="chat-date">${day.date}</div>${day.items.map(([side,msg,time])=>`
        <div class="chat-line ${side==='out'?'outgoing':'incoming'}">
          ${side==='in'?'<img class="chat-profile" src="icons/jaegwan.jpeg" alt="재관이">':''}
          ${side==='in'?`<div class="chat-stack"><div class="chat-sender">재관이 🖤</div><div class="chat-bubble">${chatEscape(msg)}</div></div>`:''}
          ${side==='out'?`<div class="chat-meta">${day.unread?'<span class="chat-unread">1</span>':''}<span>${time}</span></div><div class="chat-bubble">${chatEscape(msg)}</div>`:`<div class="chat-meta"><span>${time}</span></div>`}
        </div>`).join('')}`).join('')}
    </div>
    <div class="chat-inputbar"><button class="chat-plus" aria-label="첨부">＋</button><div class="chat-input-shell"><span>메시지 입력</span><span>☻</span></div><button class="chat-tool" aria-label="해시태그">#</button></div>
  </div>`;
  requestAnimationFrame(()=>{const area=document.getElementById('jaegwan-scroll');if(area)area.scrollTop=area.scrollHeight;});
}

function naverSearch(){let v=document.getElementById('naverinput').value.trim();if(v)document.querySelector('.naver-body').innerHTML=`<h3>검색어</h3><div class="searchitem">${v}</div>`}
window.currentApp='';function openApp(name){if(name==='사진'||name==='캘린더')return;if(name==='YouTube'){window.location.href='https://www.youtube.com/';return}if(name==='음악'){window.location.href='https://music.youtube.com/';return}window.currentApp=name;document.getElementById('appname').textContent=name;let pages={'전화':phonePage,'메시지':messagePage,'Safari':naverPage,'카카오톡':kakaoPage};document.getElementById('appcontent').innerHTML=pages[name]?pages[name]():name==='미리 알림'?'<div class="dark-app"><button class="appback" onclick="goHome()">‹ 홈</button><h2>미리 알림</h2><p>◯ 12월 9일 — 재관이 생일 🎂</p></div>':`<button class="appback" onclick="goHome()">‹ 홈</button><h2 style="padding:20px">${name}</h2><p style="padding:20px">내용은 다음에 추가할게.</p>`;show('appview')}
</script></body></html>
